<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คเครื่องจักรและบันทึกปัญหา</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-top: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-item input {
            width: auto;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .machine-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .machine-radio {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 500;
        }
        .machine-radio input {
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ระบบตรวจสอบเครื่องจักรและบันทึกปัญหาประจำวัน</h1>
    
    <form id="machineForm">
        <!-- เลือกเครื่องจักร -->
        <h2>เลือกเครื่องจักร</h2>
        <div class="machine-selector">
            <label class="machine-radio"><input type="radio" name="machine" value="Makino V55" checked> Makino V55</label>
            <label class="machine-radio"><input type="radio" name="machine" value="Yasda 950V"> Yasda 950V</label>
            <label class="machine-radio"><input type="radio" name="machine" value="YMC650"> YMC650</label>
        </div>

        <!-- เช็คเครื่องจักร -->
        <h2>เช็คเครื่องจักร (Daily Checklist)</h2>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" name="check" value="ระดับน้ำมันหล่อลื่น"> ระดับน้ำมันหล่อลื่น</label>
            <label class="checkbox-item"><input type="checkbox" name="check" value="แรงดันลมอัด (Air Pressure)"> แรงดันลมอัด</label>
            <label class="checkbox-item"><input type="checkbox" name="check" value="ความสะอาดหน้าโต๊ะงาน"> ความสะอาดหน้าโต๊ะงาน</label>
            <label class="checkbox-item"><input type="checkbox" name="check" value="ระบบน้ำหล่อเย็น (Coolant)"> ระบบน้ำหล่อเย็น</label>
            <label class="checkbox-item"><input type="checkbox" name="check" value="สภาพหัวจับทูล (Tooling)"> สภาพหัวจับทูล</label>
        </div>

        <!-- รอบฟีด -->
        <h2>รอบฟีด (Feed Rate & Speed Setup)</h2>
        <div class="form-group">
            <label for="feedRate">ตั้งค่าอัตราป้อน (Feed Rate - mm/min):</label>
            <input type="number" id="feedRate" placeholder="เช่น 1200">
        </div>
        <div class="form-group">
            <label for="spindleSpeed">ความเร็วรอบสปินเดิล (Spindle Speed - RPM):</label>
            <input type="number" id="spindleSpeed" placeholder="เช่น 10000">
        </div>

        <!-- ปัญหาประจำวัน -->
        <h2>ปัญหาประจำวัน (Daily Issue Log)</h2>
        <div class="form-group">
            <label for="dailyProblem">บันทึกปัญหาที่พบหน้างาน / ข้อผิดพลาดในการทำงาน:</label>
            <textarea id="dailyProblem" placeholder="ระบุปัญหา เช่น เสียงผิดปกติระหว่างกัดหยาบ (Rough Milling), ด้ามมีดสั่น หรือโค้ด G-code มีปัญหา..."></textarea>
        </div>

        <button type="submit">บันทึกข้อมูล</button>
    </form>
</div>

<script>
    document.getElementById('machineForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('บันทึกข้อมูลเครื่องจักรเรียบร้อยแล้ว!');
    });
</script>

</body>
</html>
