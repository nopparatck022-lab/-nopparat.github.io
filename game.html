<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมยิงเป้าสุดมันส์</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 10px;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: crosshair;
        }
        .nav-bar {
            width: 100%;
            max-width: 650px;
            margin-bottom: 5px;
        }
        .nav-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .header-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 650px;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .game-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            height: 480px;
            background: #1e293b url('https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            border: 3px solid #38bdf8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* เป้าหมายรูปภาพชัดเจน */
        .target {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #ef4444;
            background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            transition: transform 0.1s;
        }
        .target:active { transform: scale(0.8); }

        /* ตัวละครยืนถือปืนด้านล่างจอ */
        .shooter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 85px;
            background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
            z-index: 5;
        }
        .gun-barrel {
            position: absolute;
            bottom: 45px;
            left: 50%;
            width: 6px;
            height: 55px;
            background: #cbd5e1;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            pointer-events: none;
            z-index: 4;
            border-radius: 3px;
        }

        /* หน้าจอจบเกม / หัวเราะสะใจ */
        .game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            display: none;
            z-index: 10;
        }
        .laugh-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 30px #38bdf8;
            margin-bottom: 15px;
            animation: laughBounce 0.4s infinite alternate;
        }
        @keyframes laughBounce {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1.08) rotate(5deg); }
        }
        .restart-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .restart-btn:hover { background: #0284c7; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-btn">⬅ กลับหน้าหลัก</a>
    </div>

    <div class="header-panel">
        <span id="scoreDisplay">🎯 เป้าที่เหลือ: 50 / 50</span>
        <span id="timerDisplay">⏱️ เวลา: 0.0s</span>
    </div>

    <div class="game-container" id="gameContainer">
        <!-- ตัวละครยืนยิงและปืน -->
        <div class="shooter" id="shooter"></div>
        <div class="gun-barrel" id="gunBarrel"></div>

        <!-- หน้าจอชนะ / หัวเราะสะใจ -->
        <div class="game-over-screen" id="gameOverScreen">
            <div class="laugh-img"></div>
            <h2 style="color: #38bdf8; margin: 5px 0;">สุดยอด! ยิงครบ 50 เป้าแล้ว 😎</h2>
            <p id="finalTimeText" style="color: #cbd5e1; margin: 5px 0;"></p>
            <button class="restart-btn" onclick="startGame()">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

<script>
    let targetsLeft = 50;
    let startTime = null;
    let timerInterval = null;
    let gamePlaying = false;

    const container = document.getElementById('gameContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalTimeText = document.getElementById('finalTimeText');
    const gunBarrel = document.getElementById('gunBarrel');

    // ให้ปืนหันเล็งตามตำแหน่งเมาส์
    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const shooterX = rect.left + rect.width / 2;
        const shooterY = rect.bottom - 45;
        
        let mouseX = e.clientX;
        let mouseY = e.clientY;

        let angle = Math.atan2(mouseY - shooterY, mouseX - shooterX) * (180 / Math.PI) + 90;
        gunBarrel.style.transform = `translateX(-50%) rotate(${angle}deg)`;
    });

    function startGame() {
        container.querySelectorAll('.target').forEach(t => t.remove());
        gameOverScreen.style.display = 'none';
        targetsLeft = 50;
        gamePlaying = true;
        scoreDisplay.innerText = `🎯 เป้าที่เหลือ: ${targetsLeft} / 50`;
        
        startTime = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            let elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            timerDisplay.innerText = `⏱️ เวลา: ${elapsed}s`;
        }, 100);

        const maxX = container.clientWidth - 80;
        const maxY = container.clientHeight - 130;

        for (let i = 0; i < 50; i++) {
            let t = document.createElement('div');
            t.className = 'target';
            
            let rx = Math.floor(Math.random() * maxX);
            let ry = Math.floor(Math.random() * maxY);
            t.style.left = rx + 'px';
            t.style.top = ry + 'px';

            t.addEventListener('click', (e) => {
                e.stopPropagation();
                if (!gamePlaying) return;

                t.remove();
                targetsLeft--;
                scoreDisplay.innerText = `🎯 เป้าที่เหลือ: ${targetsLeft} / 50`;

                if (targetsLeft <= 0) {
                    endGame();
                }
            });

            container.appendChild(t);
        }
    }

    function endGame() {
        gamePlaying = false;
        clearInterval(timerInterval);
        let totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
        finalTimeText.innerText = `ใช้เวลาไปทั้งหมด: ${totalTime} วินาที!`;
        gameOverScreen.style.display = 'flex';
    }

    startGame();
</script>

</body>
</html>
